version: "8.2.0"

compose:
  files:
    - .dockerdev/docker-compose.yml
  project_name: pairdrop

interaction:
  sh:
    description: Shell inside the app container
    service: app
    command: /bin/sh

  npm:
    description: Run npm commands inside the app container
    service: app
    command: npm
    compose_run_options: [no-deps]

  logs:
    description: Follow the app container's logs
    command: docker logs -f pairdrop

  deploy:
    description: >-
      Redeploy the pushed develop branch on the Lightsail server (same script GitHub Actions runs).
      Needs a `nearshare` host in ~/.ssh/config; see deploy/README.md.
    command: ssh nearshare ./deploy.sh

provision:
  - dip compose build
  - dip up -d --wait
