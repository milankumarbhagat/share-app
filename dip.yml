version: "8.2.0"

compose:
  files:
    - .dockerdev/docker-compose.yml
  project_name: pairdrop

interaction:
  sh:
    description: Shell inside the app container
    service: app
    command: /bin/sh

  npm:
    description: Run npm commands inside the app container
    service: app
    command: npm
    compose_run_options: [no-deps]

  logs:
    description: Follow the app container's logs
    command: docker logs -f pairdrop

  deploy:
    description: >-
      Pull the pushed branch on the Lightsail server and rebuild. Needs a `nearshare` host in
      ~/.ssh/config; see deploy/README.md.
    command: >-
      ssh nearshare 'cd share-app && git pull --ff-only &&
      cd deploy && sudo docker compose up -d --build && sudo docker compose ps'

provision:
  - dip compose build
  - dip up -d --wait
