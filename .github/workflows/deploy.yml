# Redeploys the Lightsail server whenever develop changes (push or merged PR).
# The server side is ~/deploy.sh; the SSH key behind DEPLOY_SSH_KEY can run nothing else.
# Setup: deploy/README.md, "Automatic deploys".
name: Deploy

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

# Queue deploys instead of running two at once; never cancel one half-way.
concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "ubuntu@$HOST"

      - name: Check the site responds
        run: curl -fsS -o /dev/null --retry 6 --retry-delay 5 --retry-all-errors https://share.milanthemusafir.com/
